[job]
dump_folder = "./outputs"
description = "Llama 3 130M training with Ghost GradDotProd"

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 100
enable_memory_snapshot = false
save_memory_snapshot_folder = "memory_snapshot"

[metrics]
log_freq = 1
enable_tensorboard = true
save_tb_folder = "tb"
enable_wandb = true

[model]
name = "llama3"
flavor = "130M"
hf_assets_path = "./assets/hf/Llama-3.1-8B"

[optimizer]
name = "AdamW"
lr = 3e-4
eps = 1e-8
beta1 = 0.9
beta2 = 0.999
weight_decay = 0.1
implementation = "fused"

[lr_scheduler]
warmup_steps = 200
decay_type = "cosine"
decay_ratio = 0.0
min_lr_factor = 0.1

[training]
local_batch_size = 2
global_batch_size = 2
seq_len = 4096
max_norm = 1.0
steps = 1000
dataset = "c4_500gb"

[training.dataloader]
num_workers = 4
persistent_workers = true
prefetch_factor = 4
pin_memory = true

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = 1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1
context_parallel_degree = 1

[checkpoint]
enable = false
folder = "checkpoint"
interval = 500
last_save_model_only = false
export_dtype = "float32"
async_mode = "disabled"

# Compile is enabled for the default ghost fast path (decoupled-Function + top-level output
# compile). GhostTrainer defers it until after the ghost manager attaches; on the eager path
# (decoupled_fn=false) GhostTrainer hard-disables it. Override with --compile.enable=false.
[compile]
enable = true
components = ["model", "loss"]
backend = "inductor"

# Default = op-SAC "mme1" (op-level selective AC, recompute all matmuls): 43 GiB peak /
# +14.8% tps over the eager engine on H200/130M — the runtime-memory frontier optimum.
# For max throughput at higher memory set
# mode="none"; for higher-memory/faster op-SAC points raise --ghost.opsac_mm_every.
[activation_checkpoint]
mode = "selective"
selective_ac_option = "op"

[quantize.linear.float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false
filter_fqns = ["output"]

[validation]
enable = true
dataset = "pile_test"
freq = 2
steps = 10
local_batch_size = 4
seq_len = 4096

[debug]
seed = 42

[ghost]
enable = true
val_batch_size = 2
val_dataset = "pile_test"
save_dir = "./outputs/ghost_dotprods"
save_interval = 50
save_train_batch = false
log_grad_norms = false
use_dummy_bias = false
enable_validation = true

# Dot-product runtime levers (override on the command line, e.g. --ghost.no-decoupled_fn or
# --compile.enable=false). These values are the best-runtime combination measured on H200:
# subtract-val + the decoupled-Function path under torch.compile + top-level output compile
# (+23-25% tps over eager, loss-identical),
# with lever 1c off (1c regresses on H200; it helps on A100).
subtract_val = true
decoupled_fn = true
compile_toplevel = true
regional_compile = false
# separate-val two-pass engine: one plain
# val backward per optimizer step + train-only microbatches whose in-graph dots project against
# the harvested val gradient. Faster at grad-accum setups, ~half the combined path's peak memory
# everywhere, and the training loss/grads become bit-consistent with regular training. Dots equal
# the combined-batch dots up to a constant rescale (4x at this config's N=1). Set
# --ghost.no-separate_val to restore the v0.5 combined-batch behavior.
separate_val = true
# Compile the loss too (the deferred-compile trick otherwise leaves it EAGER — an fp32 128k-vocab
# CE the compiled baseline does not pay; ~17 ms/step here).
compile_loss = true
# op-SAC mm save-fraction (active when activation_checkpoint.selective_ac_option="op"). 1 =
# recompute all matmuls = the mme1 min-memory frontier point; raise for more memory / more speed.
opsac_mm_every = 1
